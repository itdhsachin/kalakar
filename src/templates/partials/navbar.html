{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Navbar</title>
              <link
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet"
            >
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <!-- Google tag (gtag.js) -->
            <script async src="https://www.googletagmanager.com/gtag/js?id=G-3FSFRJPHEE"></script>
            <script>
              window.dataLayer = window.dataLayer || [];
              function gtag(){dataLayer.push(arguments);}
              gtag('js', new Date());

              gtag('config', 'G-3FSFRJPHEE');
            </script>
    </head>
    <body>
        <header class="sticky-top bg-white py-2 shadow" style="z-index: 1050;">
          <div class="container">
            <div class="d-flex justify-content-between align-items-center">
              
              <!-- Logo Left -->
              <div class="headerarea_logo">
                <a href="https://kalagurubyirarangoliarts.com/">
                  <img src="{% static 'img/logo/kalaguru_logo.jpg' %}" alt="logo" style="height: 80px; width: auto;">
                </a>
              </div>

              <!-- Auth Links Right -->
              <div>
                {% if user.is_authenticated %}
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-danger px-4"><i class="fa fa-sign-out-alt"></i> Logout</button>
                    </form>
                {% else %}
                  <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm">
                    <i class="fa fa-sign-in-alt"></i> Login
                  </a>
                {% endif %}
              </div>

            </div>
          </div>
        </header> 

        
    </body>
</html>
