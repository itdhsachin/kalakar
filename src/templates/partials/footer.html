<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>
    <body>
        <footer class="bg-dark text-white mt-4 py-3">
            <div class="container">
                <div class="row">
                    <!-- Terms and Privacy - Left Aligned -->
                    <div class="col-md-6 text-md-start text-center">
                        <a href="{% url 'pages:terms_condition' %}"
                           target="_blank"
                           class="text-white text-decoration-none">
                            <h5 class="mt-3">📜 Terms and Conditions</h5>
                        </a>
                        <a href="{% url 'pages:privacy_policy' %}"
                           target="_blank"
                           class="text-white text-decoration-none">
                            <h5 class="mt-3">🔒 Privacy Policy</h5>
                        </a>
                        <a href="{% url 'pages:faq' %}"
                           target="_blank"
                           class="text-white text-decoration-none">
                            <h5 class="mt-3">❓ Frequently Asked Questions</h5>
                        </a>
                        <a href="{% url 'courses' %}"
                           target="_blank"
                           class="text-white text-decoration-none">
                            <h5 class="mt-3">📜 Browse Our Courses</h5>
                        </a>
                        <a href="{% url 'pages:competition_one_result' %}"
                           target="_blank"
                           class="text-white text-decoration-none">
                            <h5 class="mt-3">✅ KalaGuru Rangoli Competition Results 2025</h5>
                        </a>
                    </div>

                    <!-- Follow Us - Right Aligned -->
                    <div class="col-md-6 text-md-end text-center mt-3 mt-md-0">
                        <h5>📢 Follow Us</h5>
                        <ul class="list-inline mt-2">
                            <!-- <li class="list-inline-item">
                                <a href="//facebook.com" class="text-white fs-4"><i class="fa-brands fa-facebook"></i></a>
                            </li>
                            <li class="list-inline-item">
                                <a href="//twitter.com" class="text-white fs-4"><i class="fa-brands fa-twitter"></i></a>
                            </li> -->
                            <li class="list-inline-item">
                                <a target="_blank" href="https://youtube.com/@kalagurubyirarangoliarts?si=KbJ5dVwTr9qWuIQ1" 
                                   class="text-white fs-4">
                                    <i class="fa-brands fa-youtube"></i>
                                </a>
                            </li>
                            <li class="list-inline-item">
                                <a target="_blank" href="https://www.instagram.com/kalaguru_" class="text-white fs-4"><i class="fa-brands fa-instagram"></i></a>
                            </li>
                        </ul>
                    </div>
                </div>

                <hr class="border-light">

                <div class="row align-items-center">
                    <div class="col-md-12 text-center">
                        {% if user.is_authenticated %}
                            <div class="d-flex justify-content-center gap-3">
                                <form action="{% url 'logout' %}" method="post">
                                    {% csrf_token %}
                                    <button type="submit" class="btn btn-danger px-4">Logout</button>
                                </form>
                                <a href="{% url 'dashboard' %}" class="btn btn-success px-4">Go to Dashboard</a>
                            </div>
                        {% else %}
                            <a href="{% url 'login' %}" class="btn btn-primary px-4">Login</a>
                        {% endif %}
                    </div>
                </div>
                

                <hr class="border-light">

                <div class="row align-items-center">
                    <!-- Copyright Section -->
                    <div class="col-md-12 text-center">
                        <p class="mb-0">© 2025 ITDEVHUB. All Rights Reserved.</p>
                    </div>
                </div>
            </div>
        </footer>
    </body>
</html>
